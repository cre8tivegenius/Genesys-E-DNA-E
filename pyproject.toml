[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bodhisattva-dna"
version = "0.1.0"
description = "AI Safety Governance Framework - Bodhisattva DNA"
requires-python = ">=3.12"

dependencies = [
    "pydantic>=2.6,<3",
    "pydantic-settings>=2.1,<3",
    "fastapi>=0.110,<1",
    "uvicorn[standard]>=0.27,<1",
    "typer>=0.9,<1",
    "rich>=13.7,<14",
    "sqlalchemy[asyncio]>=2.0,<3",
    "asyncpg>=0.29,<1",
    "alembic>=1.13,<2",
    "structlog>=24.1,<25",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9",
    "pytest-asyncio>=0.23,<1",
    "pytest-cov>=4.1,<6",
    "hypothesis>=6.98,<7",
    "httpx>=0.27,<1",
    "mypy>=1.8,<2",
    "ruff>=0.2,<1",
]

[project.scripts]
bodhisattva = "bodhisattva.cli.main:app"

[tool.hatch.build.targets.wheel]
packages = ["src/bodhisattva"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["src"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]
